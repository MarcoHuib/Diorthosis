name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Diorthosis.sln --configuration Release
      - run: dotnet run --project src/Diorthosis.Benchmarks --configuration Release --no-build -- evaluate benchmarks/smoke/cases.jsonl benchmarks/smoke/predictions.jsonl
      - run: python3 scripts/verify-historical-artifacts.py
      - run: python3 scripts/verify-phase2-artifacts.py
      - run: python3 scripts/verify-phase3-artifacts.py
      - run: python3 -m unittest discover -s tests/tooling -p 'test_*.py'
      - run: dotnet run --project src/Diorthosis.Benchmarks --configuration Release --no-build -- audit-dataset benchmarks/model-validation/provisional-600.jsonl artifacts/dataset-audit
      - run: diff -r benchmarks/rehabilitation/v1/dataset artifacts/dataset-audit
      - run: dotnet run --project src/Diorthosis.Benchmarks --configuration Release --no-build -- adjudicate benchmarks/phase2/v1/review-analysis/subjects.jsonl benchmarks/phase2/v1/review-analysis/decisions.jsonl benchmarks/phase2/v1/review-analysis/adjudications.jsonl artifacts/review-import-check.json --lineage benchmarks/phase2/v1/review-analysis/lineage-DO-NOT-SEND-TO-REVIEWERS.json

  publish-and-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
            executable: Diorthosis.Cli.exe
          - rid: win-arm64
            runner: windows-11-arm
            executable: Diorthosis.Cli.exe
          - rid: osx-x64
            runner: macos-15-intel
            executable: Diorthosis.Cli
          - rid: osx-arm64
            runner: macos-15
            executable: Diorthosis.Cli
          - rid: linux-x64
            runner: ubuntu-24.04
            executable: Diorthosis.Cli
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            executable: Diorthosis.Cli
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/Diorthosis.Cli/Diorthosis.Cli.csproj -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Explicit development-only acquisition of the reviewed hash-pinned assets; never an app download.
      - run: python scripts/acquire-linguistic-assets.py artifacts/linguistic-assets
      - run: dotnet publish tests/NativeLinguisticProbe/NativeLinguisticProbe.csproj -c Release -r ${{ matrix.rid }} -o artifacts/linguistic-probe/${{ matrix.rid }}
      - run: artifacts/linguistic-probe/${{ matrix.rid }}/${{ runner.os == 'Windows' && 'NativeLinguisticProbe.exe' || 'NativeLinguisticProbe' }} artifacts/linguistic-assets
        shell: bash
        env:
          DOTNET_ROOT: ${{ runner.temp }}/no-dotnet-runtime
          DOTNET_MULTILEVEL_LOOKUP: 0
      - if: matrix.rid == 'osx-arm64'
        run: scripts/build-osx-arm64-cpu-backend.sh artifacts/osx-arm64
      - if: runner.os != 'Windows'
        run: chmod +x artifacts/${{ matrix.rid }}/${{ matrix.executable }}
      - run: artifacts/${{ matrix.rid }}/${{ matrix.executable }} --version
        shell: bash
        env:
          DOTNET_ROOT: ${{ runner.temp }}/no-dotnet-runtime
          DOTNET_MULTILEVEL_LOOKUP: 0
      - run: artifacts/${{ matrix.rid }}/${{ matrix.executable }} --check-native-inference
        shell: bash
        env:
          DOTNET_ROOT: ${{ runner.temp }}/no-dotnet-runtime
          DOTNET_MULTILEVEL_LOOKUP: 0
      - if: matrix.rid == 'linux-x64'
        run: |
          strace -f -e trace=network -o network.trace artifacts/${{ matrix.rid }}/${{ matrix.executable }} --version
          strace -f -e trace=network -o inference-network.trace artifacts/${{ matrix.rid }}/${{ matrix.executable }} --check-native-inference
          if grep -Eq 'socket\(|connect\(|bind\(|listen\(|sendto\(|recvfrom\(' network.trace; then
            echo "Unexpected network syscall during offline CLI startup or native inference initialization"
            exit 1
          fi
          if grep -Eq 'socket\(|connect\(|bind\(|listen\(|sendto\(|recvfrom\(' inference-network.trace; then
            echo "Unexpected network syscall during offline native inference initialization"
            exit 1
          fi
